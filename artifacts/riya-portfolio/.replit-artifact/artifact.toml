kind = "web"
previewPath = "/"
title = "Riya Singh Portfolio"
description = "An editable personal portfolio for Riya Singh, an entry-level software developer, showcasing her education, skills, internship experience, and selected projects."
version = "1.0.0"
id = "artifacts/riya-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18765

[services.development]
run = "pnpm --filter @workspace/riya-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/riya-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/riya-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18765"
BASE_PATH = "/"
